
name: Arsin Auto Reply Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 17

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram

      - name: Run bot for 15 minutes
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          timeout --signal=INT --kill-after=10s 15m python arsin_auto_reply_fixed.py || code=$?
          if [ "${code:-0}" -eq 124 ] || [ "${code:-0}" -eq 130 ]; then
            echo "15-minute session completed."
          elif [ "${code:-0}" -ne 0 ]; then
            exit "$code"
          fi
